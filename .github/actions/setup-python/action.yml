name: Set up Python (the version the image runs)
description: >-
  Installs the Python version named in the Dockerfile's `FROM python:` line. The Dockerfile is the
  only place the version is written: CI cannot test on an interpreter the image does not run, and a
  dependency update of the base image moves both in one pull request the agents can handle.

runs:
  using: composite
  steps:
    - name: Python version of the image
      id: version
      shell: bash
      run: |
        version=$(sed -n 's/^FROM python:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile | head -n 1)
        [ -n "$version" ] || { echo "::error::no 'FROM python:<version>' line in Dockerfile"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Python $version"

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.version.outputs.version }}

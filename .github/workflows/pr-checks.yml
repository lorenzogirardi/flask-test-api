name: PR Checks

# Deterministic pre-merge gate. This is the check auto-merge should trust —
# not an LLM reading a diff.
#
# Until this existed, pipeline.yml (build/lint/pytest/docker/trivy/k8s-check)
# only ran `on: push: [main]`, so nothing was ever built or tested on a PR:
# the first pytest of a change happened AFTER it landed. Two auto-merged
# dependency bumps broke main that way in one morning, both of them things a
# command proves in seconds while a diff review can only guess at:
#
#   - python 3.12 -> 3.14 made `pip install -r requirements.txt` unsolvable
#     (mcp needs pydantic>=2.12 on 3.14, requirements.txt pinned 2.11.7).
#     Caught here by "Resolve dependencies".
#   - fastapi 0.115 -> 0.141 made every request 500 (instrumentator 7.0.2
#     can't read the new router objects). Caught here by "Smoke-test".
#
# Heavy jobs (multi-arch docker build, trivy, sbom, kind cluster) stay in
# pipeline.yml on main — too slow to run per PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (the version the image runs)
        # Read from the Dockerfile, the only place the version is written: a
        # dependency set can resolve on one interpreter and not another
        # (that is exactly how the 3.14 bump broke main).
        uses: ./.github/actions/setup-python

      - name: Resolve dependencies
        # Separate from the install so a resolver conflict is reported as its
        # own failed step rather than buried in install output.
        run: |
          python -m pip install --upgrade pip
          # No --quiet: it suppresses the "The conflict is caused by:" block,
          # which is the only part that names the incompatible pins. Without
          # it the log says ResolutionImpossible and nothing about why —
          # useless to a human and to the AI triage that reads these logs.
          pip install --dry-run -r requirements.txt

      - name: Install dependencies
        run: |
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Tests
        run: pytest tests/ -v

      - name: Smoke-test the running app
        # The suite runs with PROMETHEUS_ENABLED=false (conftest.py), so it
        # cannot see a middleware that only loads in production. This starts
        # the app the way the container does and makes a real request.
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/ready; then
              echo "app is serving"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::app never returned 2xx on /api/mgmt/ready"
              exit 1
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/health
          curl -sf -o /dev/null http://127.0.0.1:8000/metrics

  integration:
    # The integration suite against the real backends. It used to be skipped
    # everywhere (it needs a live service), so it rotted unnoticed and a broken
    # /api/mgmt/mappings reached main. This is the gate that catches that class
    # of defect before merge; the in-memory suite above cannot see it.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pytbak
          POSTGRES_PASSWORD: pytbak
          POSTGRES_DB: pytbak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pytbak" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (the version the image runs)
        uses: ./.github/actions/setup-python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Start the app against PostgreSQL and Redis
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://pytbak:pytbak@localhost:5432/pytbak
          REDIS_URL: redis://localhost:6379/0
          PROMETHEUS_ENABLED: "true"
          DEBUG_ENDPOINTS_ENABLED: "true"
          MCP_ENABLED: "true"
          ERROR_INJECTION_ENABLED: "true"
          DIAG_USERNAME: admin
          DIAG_PASSWORD: password
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/ready; then
              echo "app is serving"
              exit 0
            fi
            sleep 1
          done
          echo "::error::app never returned 2xx on /api/mgmt/ready"
          cat app.log
          exit 1

      - name: Integration tests
        run: pytest tests/integration -v

      - name: App log on failure
        if: failure()
        run: cat app.log

  image:
    # The artifact that ships, built from THIS pull request and run against real PostgreSQL
    # and Redis in a kind cluster, with the integration suite. A change to the Dockerfile
    # (the Python base image) or to the dependencies is proven here, before the merge,
    # instead of being discovered on main and reverted. Reviewers cannot verify that from a
    # diff, so this check is what answers "do the dependencies still work on the new image?".
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Does this commit change what this job proves?
        # A commit that only adds or changes unit tests, on top of a commit whose image was built,
        # deployed and tested here with success, ships the same image: building and deploying it
        # again proves nothing new and was two and a half minutes of every agent commit that adds
        # tests. The job still ends in success, which is what the merge gate asks of it. Anything
        # else, or any doubt (no parent result, an error), builds as before.
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          same=false
          commit="$(gh api "repos/$REPO/commits/$HEAD_SHA" 2>/dev/null || true)"
          parent="$(jq -r '.parents[0].sha // empty' <<<"$commit" 2>/dev/null || true)"
          files="$(jq -r '.files[].filename' <<<"$commit" 2>/dev/null || true)"
          if [ -n "$parent" ] && [ -n "$files" ] \
             && ! grep -qvE '^tests/' <<<"$files" \
             && ! grep -qE '^tests/(integration|k8s)/' <<<"$files"; then
            proved="$(gh api "repos/$REPO/commits/$parent/check-runs?check_name=image" \
                      --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)"
            if [ "${proved:-0}" -gt 0 ]; then same=true; fi
          fi
          echo "same=$same" >> "$GITHUB_OUTPUT"
          if [ "$same" = "true" ]; then
            echo "Only unit tests changed since ${parent:0:7}, whose image passed this job: nothing to build again." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the image from this pull request
        if: steps.scope.outputs.same != 'true'
        run: docker build -t pytbak:pr .

      # Awareness, never a gate: what the scan finds is a warning on the run, a section of its
      # summary and evidence for the agents (artifact ai-context-*). It cannot fail this job.
      - name: Scan the image (awareness)
        if: steps.scope.outputs.same != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: pytbak:pr
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          output: trivy-results.txt
      - name: Report what the scan found (awareness, never blocks)
        if: always() && steps.scope.outputs.same != 'true'
        run: |
          if grep -q "CRITICAL: [1-9]" trivy-results.txt 2>/dev/null; then
            echo "::warning title=Trivy::critical vulnerabilities in the image, listed in the run summary"
          fi
          {
            echo "### Trivy: critical vulnerabilities in the image (not blocking)"
            echo '```'
            head -c 20000 trivy-results.txt 2>/dev/null || echo "the scan produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (trivy)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-trivy
          path: trivy-results.txt
          if-no-files-found: ignore
          retention-days: 1

      # Awareness, never a gate: what the image contains, for the security role to read. On main the
      # SBOM was produced and read by nobody. It cannot fail this job.
      - name: SBOM of the image (awareness)
        if: steps.scope.outputs.same != 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        continue-on-error: true
        with:
          image: pytbak:pr
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Report what the image contains (awareness, never blocks)
        if: always() && steps.scope.outputs.same != 'true'
        run: |
          {
            echo "SBOM of the image built from this pull request (syft, SPDX)."
            if [ -s sbom.spdx.json ]; then
              jq -r '
                def kind: [.externalRefs[]?.referenceLocator // empty | select(startswith("pkg:")) | split("/")[0] | ltrimstr("pkg:")][0] // "other";
                (.packages // []) as $p
                | "packages: \($p | length) in all; by kind: \([$p[] | kind] | group_by(.) | map("\(.[0]) \(length)") | join(", "))",
                  "python packages (name version):",
                  ($p[] | select(kind == "pypi") | "  \(.name) \(.versionInfo // "?")")
              ' sbom.spdx.json | head -n 150
            else
              echo "the SBOM could not be produced for this image"
            fi
          } > sbom-evidence.txt
          { echo "### SBOM: what the image contains (not blocking)"; echo '```'; head -c 6000 sbom-evidence.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (sbom)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-sbom
          path: sbom-evidence.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Create a kind cluster
        if: steps.scope.outputs.same != 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: pytbak-pr

      - name: Deploy the stack with the image (app + PostgreSQL + Redis)
        if: steps.scope.outputs.same != 'true'
        run: |
          set -euo pipefail
          kind load docker-image pytbak:pr --name pytbak-pr
          sed "s#IMAGE_PLACEHOLDER#pytbak:pr#" tests/k8s/stack.yaml | kubectl apply -f -
          kubectl wait --for=condition=available deployment/postgres deployment/redis --timeout=240s
          # The app picks its backends once, at startup: restart it now that they are ready, and
          # wait for the NEW pod (`wait --for=condition=available` is already true for the old one).
          kubectl rollout restart deployment/pytbak
          kubectl rollout status deployment/pytbak --timeout=240s
          kubectl port-forward deploy/pytbak 8000:8000 &>/dev/null &
          sleep 3

      - name: Set up Python (the version the image runs)
        if: steps.scope.outputs.same != 'true'
        uses: ./.github/actions/setup-python

      - name: Integration tests against the image
        if: steps.scope.outputs.same != 'true'
        run: |
          pip install -r requirements.txt pytest
          pytest tests/integration -v

      - name: Pod state and logs on failure
        if: failure()
        run: |
          kubectl get po -o wide || true
          kubectl logs deploy/pytbak --tail=100 || true

      - name: Deploy evidence for the agents
        # What an SRE would look at: did the pods come up, did they restart, what did the app log.
        if: always() && steps.scope.outputs.same != 'true'
        run: |
          {
            echo "## Deploy of this pull request's image in a kind cluster"
            echo "job status: ${{ job.status }}"
            echo "### Pods"; kubectl get po -o wide 2>&1 || true
            echo "### Rollout"; kubectl rollout status deployment/pytbak --timeout=5s 2>&1 || true
            echo "### App log (last lines)"; kubectl logs deploy/pytbak --tail=40 2>&1 || true
          } > deploy-evidence.txt
      - name: Upload evidence (deploy)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-deploy
          path: deploy-evidence.txt
          if-no-files-found: ignore
          retention-days: 1

  awareness:
    # Security tools inform; they do not gate. This job is not a required check and no step in it
    # can fail it on a finding: each tool leaves a warning on the run, a section of its summary and
    # an ai-context-* artifact the agents read as evidence. What gates is whether the app works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkov on the helm chart
        uses: bridgecrewio/checkov-action@29be5868bfa968f099ae80169f61f42887494b8f # v12.3133.0
        continue-on-error: true
        with:
          framework: helm
          directory: ./helm/
          output_format: sarif
          soft_fail: true
          quiet: true
      - name: Report what Checkov found (awareness, never blocks)
        if: always()
        run: |
          count=$(jq '[.runs[].results[]] | length' results.sarif 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Checkov::$count finding(s) in the helm chart, listed in the run summary"
          fi
          {
            echo "### Checkov: helm chart ($count finding(s), not blocking)"
            jq -r '[.runs[].results[] | "- `\(.ruleId)` \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri // "?"))"] | unique | .[]' results.sarif 2>/dev/null | head -n 60 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: TruffleHog on the commits of this pull request
        id: trufflehog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        continue-on-error: true
        with:
          extra_args: --results=verified,unknown
      - name: Report what TruffleHog found (awareness, never blocks)
        if: always()
        env:
          OUTCOME: ${{ steps.trufflehog.outcome }}
        run: |
          # The values themselves are never written here: only that something was found, and where
          # to look (the annotations of the step above carry file and line).
          if [ "$OUTCOME" = "failure" ]; then
            echo "::warning title=TruffleHog::possible secrets in the commits of this pull request, see the annotations of this job"
            echo "TruffleHog: possible secrets found in the commits of this change (file and line are in the job's annotations)." > secrets-evidence.txt
          else
            echo "TruffleHog: no secrets found in the commits of this change." > secrets-evidence.txt
          fi
          { echo "### TruffleHog: secrets in the commits (not blocking)"; cat secrets-evidence.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence (checkov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-checkov
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload evidence (secrets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-secrets
          path: secrets-evidence.txt
          if-no-files-found: ignore
          retention-days: 1

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        # Catches what only surfaced by running the workflow before: an
        # invalid `if-no-files-found: ok` sat unnoticed in release-notes.yml
        # because that workflow only fires on a merged PR, and none had ever
        # been merged.
        uses: raven-actions/actionlint@v2

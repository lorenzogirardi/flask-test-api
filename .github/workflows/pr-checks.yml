name: PR Checks

# Deterministic pre-merge gate. This is the check auto-merge should trust —
# not an LLM reading a diff.
#
# Until this existed, pipeline.yml (build/lint/pytest/docker/trivy/k8s-check)
# only ran `on: push: [main]`, so nothing was ever built or tested on a PR:
# the first pytest of a change happened AFTER it landed. Two auto-merged
# dependency bumps broke main that way in one morning, both of them things a
# command proves in seconds while a diff review can only guess at:
#
#   - python 3.12 -> 3.14 made `pip install -r requirements.txt` unsolvable
#     (mcp needs pydantic>=2.12 on 3.14, requirements.txt pinned 2.11.7).
#     Caught here by "Resolve dependencies".
#   - fastapi 0.115 -> 0.141 made every request 500 (instrumentator 7.0.2
#     can't read the new router objects). Caught here by "Smoke-test".
#
# Heavy jobs (multi-arch docker build, trivy, sbom, kind cluster) stay in
# pipeline.yml on main — too slow to run per PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Must match pipeline.yml and the Dockerfile base image: a
          # dependency set can resolve on one interpreter and not another
          # (that is exactly how the 3.14 bump broke main).
          python-version: "3.14"

      - name: Resolve dependencies
        # Separate from the install so a resolver conflict is reported as its
        # own failed step rather than buried in install output.
        run: |
          python -m pip install --upgrade pip
          # No --quiet: it suppresses the "The conflict is caused by:" block,
          # which is the only part that names the incompatible pins. Without
          # it the log says ResolutionImpossible and nothing about why —
          # useless to a human and to the AI triage that reads these logs.
          pip install --dry-run -r requirements.txt

      - name: Install dependencies
        run: |
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Tests
        run: pytest tests/ -v

      - name: Smoke-test the running app
        # The suite runs with PROMETHEUS_ENABLED=false (conftest.py), so it
        # cannot see a middleware that only loads in production. This starts
        # the app the way the container does and makes a real request.
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/ready; then
              echo "app is serving"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::app never returned 2xx on /api/mgmt/ready"
              exit 1
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/health
          curl -sf -o /dev/null http://127.0.0.1:8000/metrics

  integration:
    # The integration suite against the real backends. It used to be skipped
    # everywhere (it needs a live service), so it rotted unnoticed and a broken
    # /api/mgmt/mappings reached main. This is the gate that catches that class
    # of defect before merge; the in-memory suite above cannot see it.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pytbak
          POSTGRES_PASSWORD: pytbak
          POSTGRES_DB: pytbak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pytbak" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Start the app against PostgreSQL and Redis
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://pytbak:pytbak@localhost:5432/pytbak
          REDIS_URL: redis://localhost:6379/0
          PROMETHEUS_ENABLED: "true"
          DEBUG_ENDPOINTS_ENABLED: "true"
          MCP_ENABLED: "true"
          ERROR_INJECTION_ENABLED: "true"
          DIAG_USERNAME: admin
          DIAG_PASSWORD: password
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/ready; then
              echo "app is serving"
              exit 0
            fi
            sleep 1
          done
          echo "::error::app never returned 2xx on /api/mgmt/ready"
          cat app.log
          exit 1

      - name: Integration tests
        run: pytest tests/integration -v

      - name: App log on failure
        if: failure()
        run: cat app.log

  image:
    # The artifact that ships, built from THIS pull request and run against real PostgreSQL
    # and Redis in a kind cluster, with the integration suite. A change to the Dockerfile
    # (the Python base image) or to the dependencies is proven here, before the merge,
    # instead of being discovered on main and reverted. Reviewers cannot verify that from a
    # diff, so this check is what answers "do the dependencies still work on the new image?".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image from this pull request
        run: docker build -t pytbak:pr .

      - name: Create a kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: pytbak-pr

      - name: Deploy the stack with the image (app + PostgreSQL + Redis)
        run: |
          set -euo pipefail
          kind load docker-image pytbak:pr --name pytbak-pr
          sed "s#IMAGE_PLACEHOLDER#pytbak:pr#" tests/k8s/stack.yaml | kubectl apply -f -
          kubectl wait --for=condition=available deployment/postgres deployment/redis --timeout=240s
          # The app picks its backends once, at startup: restart it now that they are ready, and
          # wait for the NEW pod (`wait --for=condition=available` is already true for the old one).
          kubectl rollout restart deployment/pytbak
          kubectl rollout status deployment/pytbak --timeout=240s
          kubectl port-forward deploy/pytbak 8000:8000 &>/dev/null &
          sleep 3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Integration tests against the image
        run: |
          pip install -r requirements.txt pytest
          pytest tests/integration -v

      - name: Pod state and logs on failure
        if: failure()
        run: |
          kubectl get po -o wide || true
          kubectl logs deploy/pytbak --tail=100 || true

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        # Catches what only surfaced by running the workflow before: an
        # invalid `if-no-files-found: ok` sat unnoticed in release-notes.yml
        # because that workflow only fires on a merged PR, and none had ever
        # been merged.
        uses: raven-actions/actionlint@v2

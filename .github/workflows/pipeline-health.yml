name: Pipeline Health

# The pipeline checks itself, because nobody else does: a commit on main that no build covers (the build
# is then started), a pull request certified although an agent could not do its job, an agent workflow
# that fails, a pull request left with no verdict and nothing running (it is then abandoned). No model. Red means one of those was found; the run summary says which.
# Design: docs/13-agent-pipeline.md.

# Started by events as well as by the clock: GitHub runs scheduled workflows late on a small repository
# (three runs in fourteen hours were seen for this "every 30 minutes"), and a safety net that waits six
# hours is not one. A run takes about twenty seconds.
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pipeline-health
  cancel-in-progress: true

jobs:
  health:
    permissions:
      contents: read
      actions: write        # start pipeline.yml on main when commits have no build
      pull-requests: write  # abandon a pull request that has no verdict and nothing left to run
      issues: write
    uses: lorenzogirardi/ci-shared/.github/workflows/reusable_pipeline-health.yml@v2
    with:
      base_branch: main
      build_workflow: pipeline.yml
      agent_workflows: 'Agent Change,Agent CI Failure,Agent Merge,Agent Main Guard,AI Review Sweep,Changelog,Pipeline Canary'

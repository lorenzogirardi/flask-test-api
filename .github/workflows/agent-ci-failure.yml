name: Agent CI Failure

# When PR Checks fails on a pull request, the agent takes the failing checks'
# own logs (including `integration`, which needs services the agent's job does
# not have), decides for each failing test whether the CODE or the TEST is wrong
# (tests are the specification: the test is changed only if the PR's own stated
# intent explicitly redefines it), fixes accordingly and pushes to the PR branch.
# It stops after 3 consecutive agent commits that still fail CI.
# Renovate's PRs are handled by the sweep. Design: docs/13-agent-pipeline.md.

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions: {}

jobs:
  repair:
    if: >-
      vars.AI_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    concurrency:
      group: agent-ci-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: lorenzogirardi/ci-shared/.github/workflows/reusable_agent-change.yml@v2
    with:
      mode: ci
      base_branch: main
      required_checks: 'checks,integration,workflows'
      max_ci_attempts: 3
      python_version: "3.14"
      verify_command: |
        set -euo pipefail
        pip install --dry-run -r requirements.txt
        pip install -q -r requirements.txt
        pip install -q flake8 pytest
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        pytest tests/ -v
        uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        UVICORN_PID=$!
        trap 'kill $UVICORN_PID 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do
          curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/ready && exit 0
          sleep 1
        done
        echo "app never returned 2xx on /api/mgmt/ready" >&2
        exit 1
      openrouter_model: ${{ vars.OPENROUTER_MODEL }}
      openrouter_endpoint: ${{ vars.OPENROUTER_ENDPOINT }}
      openrouter_site_url: ${{ vars.OPENROUTER_SITE_URL }}
      openrouter_app_name: ${{ vars.OPENROUTER_APP_NAME }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      agent_push_token: ${{ secrets.AUTOFIX_PUSH_TOKEN }}

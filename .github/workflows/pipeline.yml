name: Python application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Derive image tag
      id: version
      # MAJOR.MINOR comes from pyproject.toml (single source of truth); PATCH is the
      # run number so every build gets a unique, monotonic v<major>.<minor>.<n> tag.
      run: |
        set -euo pipefail
        base=$(grep -oE '^version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+' pyproject.toml \
               | grep -oE '[0-9]+\.[0-9]+$')
        if [ -z "$base" ]; then echo "::error::could not parse version from pyproject.toml"; exit 1; fi
        tag="v${base}.${GITHUB_RUN_NUMBER}"
        echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "image tag: ${tag}"
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests
      run: |
        pytest tests/ -v
  docker:
        needs: build
        runs-on: ubuntu-latest
        steps:
        - name: Harden Runner
          uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
          with:
            egress-policy: audit

        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up QEMU
          uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        # setup Docker buld action
        - name: Set up Docker Buildx
          id: buildx
          uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

        - name: Login to DockerHub
          uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Login to Github Packages
          uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GIT_TOKEN }}

        - name: Build image and push to Docker Hub and GitHub Container Registry
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
          with:
            context: .
            cache-from: type=gha
            cache-to: type=gha,mode=max
            platforms: linux/amd64,linux/arm64
            tags: |
              lgirardi/pytbak:${{ needs.build.outputs.image_tag }}
            push: true
        - name: Image digest
          run: echo ${{ steps.docker_build.outputs.digest }}

  security-gate-trivy:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: scan
        with:
          image-ref: lgirardi/pytbak:${{ needs.build.outputs.image_tag }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  docker-sbom:
    needs: [build, security-gate-trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Sbom image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        continue-on-error: true
        id: sbom
        with:
          image: lgirardi/pytbak:${{ needs.build.outputs.image_tag }}
          output-file: "${{ github.event.repository.name }}-sbom.spdx.json"

  quality-gate:
    needs: docker-sbom
    permissions:
      contents: read # for actions/checkout to fetch code

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # Checks-out your repository under $GITHUB_WORKSPACE, so follow-up steps can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        id: checkov
        with:
          # This will add both a CLI output to the console and create a results.sarif file
          framework: helm
          directory: ./helm/
          output_format: sarif
          soft_fail: true
          quiet: true

  modifygit:
    needs: [build, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: modify the image
        run: |
          git config user.email l@k8s.it
          git config user.name l
          cd helm/pytbak/
          cat values.yaml
          sed -i "s+tag:.*+tag: \"$IMAGE_TAG\"+g" values.yaml
          cat values.yaml
          git add .
          git commit -m 'Done  by Github Actions   Job changemanifest: ${{ github.run_number }}'
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

  k8s-check:
    needs: [build, modifygit]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testing on a k8s Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - run: |
          kubectl cluster-info
          kubectl get nodes
      - name : Preparing cluster for kube-check
        run: |
          kubectl run kube-check --image=lgirardi/pytbak:${{ needs.build.outputs.image_tag }} --port=8000
          sleep 20
          kubectl get po
          kubectl port-forward kube-check 8000:8000 &>/dev/null &
          sleep 5
          kubectl port-forward kube-check 8000:8000 &>/dev/null &
      - run: |
          curl -I http://localhost:8000/api/

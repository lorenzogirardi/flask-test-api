name: AI Review Sweep

# Scheduled review of open Renovate PRs, with auto-merge on a clean verdict.
#
# This is the reliable path, and the reason it exists: a `schedule` run has no
# PR actor and no fork, so it gets the repo's full GITHUB_TOKEN. The
# event-driven equivalent (renovate-ai-review.yml) has to use
# pull_request_target purely because GitHub caps GITHUB_TOKEN to read-only on
# `pull_request` runs authored by a bot, which blocks merging. A sweep also
# picks up PRs opened before this workflow existed -- an event trigger never
# fires retroactively for those. Same approach openwrt/openwrt uses for its
# own LLM review (cron + workflow_dispatch, no PR trigger).
#
# Runs twice a day; use "Run workflow" to trigger it on demand.

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      max_prs:
        description: 'Max PRs to review in this run'
        required: false
        type: number
        default: 10
      authors:
        description: 'PR authors to sweep (comma-separated). Defaults to renovate[bot]; widen it to review someone else''s PR on demand.'
        required: false
        type: string
        default: 'renovate[bot]'

permissions: {}

concurrency:
  group: ai-review-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.AI_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: lorenzogirardi/ci-shared/.github/workflows/reusable_pr-review-sweep.yml@v1
    with:
      # The `||` fallback matters: on a schedule run inputs.authors is empty,
      # and an empty author filter means "every open PR" — including human
      # ones, which must never be auto-merged.
      authors: ${{ inputs.authors || 'renovate[bot]' }}
      auto_merge: true
      merge_method: squash
      # The job names from pr-checks.yml. Without this the gate only asks that
      # nothing failed, and a Renovate PR whose sole check is ai-review.yml
      # reporting "skipped" (it skips bot authors) satisfies that — which is
      # exactly how PRs #91 and #92 got merged with nothing tested.
      required_checks: 'checks,workflows'
      # On a red PR, explain the failure instead of reviewing the diff — same
      # one model call, and pr-checks.yml has already proven the failure, so
      # there is nothing left to predict.
      triage_on_failure: true
      # Go one step further: push the fix rather than describe it. Safe here
      # only because pr-checks.yml actually installs the deps, runs the tests
      # and boots the app — that run, not the model, decides whether the fix
      # lands, and required_checks below is what it must satisfy.
      autofix: true
      # Must match pr-checks.yml's own python-version — otherwise this proves
      # nothing about the real gate. See python_version's description.
      python_version: "3.14"
      # Mirrors pr-checks.yml's own steps (Resolve dependencies, Install,
      # Smoke-test) exactly, so a local pass here means the same thing a real
      # pr-checks pass would. Lint/pytest are left out: they're slower and
      # this repo's failures so far have all been resolution or boot issues,
      # never a lint/test regression the autofix caused.
      verify_command: |
        set -euo pipefail
        pip install --dry-run -r requirements.txt
        pip install -q -r requirements.txt
        uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        UVICORN_PID=$!
        # Without this, a second autofix attempt in the same job finds port
        # 8000 already bound by the first attempt's still-running server.
        # PID, not %1 - job control (needed for %-refs) is off by default in
        # a non-interactive `bash -c` shell.
        trap 'kill $UVICORN_PID 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do
          curl -sf -o /dev/null http://127.0.0.1:8000/api/mgmt/ready && exit 0
          sleep 1
        done
        echo "app never returned 2xx on /api/mgmt/ready" >&2
        exit 1
      max_prs: ${{ fromJSON(inputs.max_prs || '10') }}
      comment_heading: 'AI Dependency Review'
      system_prompt_extra: |
        These PRs are opened by Renovate and only touch dependency manifests
        or lockfiles (requirements.txt, Dockerfile base image, GitHub Actions
        pins). There is no application code to review. A clean verdict merges
        the PR automatically — patch, minor, and major bumps are treated
        identically, so judge each on the evidence in the diff and title, not
        on version-jump size alone.

        Report [Critical] only when the diff or title gives concrete evidence
        that a human needs to look first: a version that looks unpublished or
        typosquatted, a CVE fix whose advisory needs manual verification, or a
        transitive dependency change unrelated to the stated bump. A large
        version jump on its own, with no other red flag, is not [Critical].

        One exception, learned from an actual broken build: a change to the
        *runtime* version (the Python version in a Dockerfile base image or in
        a workflow's setup-python step) is ALWAYS [Critical]. You only see the
        diff, so you cannot check whether the pinned dependencies still
        resolve on the new interpreter — and they may not. Bumping this repo
        from Python 3.12 to 3.14 broke `pip install` outright, because
        `mcp==1.28.1` requires `pydantic>=2.12.0` on Python >= 3.14 while
        requirements.txt pinned `pydantic==2.11.7`. Nothing in that diff hinted
        at it. Runtime bumps need a human to verify resolution first.

        Do not comment on code style or ask for tests; there is no code here.
      openrouter_model: ${{ vars.OPENROUTER_MODEL }}
      openrouter_endpoint: ${{ vars.OPENROUTER_ENDPOINT }}
      openrouter_site_url: ${{ vars.OPENROUTER_SITE_URL }}
      openrouter_app_name: ${{ vars.OPENROUTER_APP_NAME }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      # Optional. Without it, autofix's git push authenticates as
      # GITHUB_TOKEN and GitHub silently suppresses the CI run that push
      # would trigger (its own recursive-workflow guard) -- confirmed on
      # PRs #104 and #110, both stuck forever with 0 job runs. A
      # fine-grained PAT (Contents: Read and write, this repo only --
      # never `workflow` scope) sidesteps that. If AUTOFIX_PUSH_TOKEN
      # isn't set, this evaluates to empty and ci-shared falls back to
      # GITHUB_TOKEN, same as before.
      autofix_push_token: ${{ secrets.AUTOFIX_PUSH_TOKEN }}

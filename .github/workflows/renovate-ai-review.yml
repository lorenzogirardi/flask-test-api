name: Renovate AI Review

# This repo's dependency bot is Renovate (renovate.json), not Dependabot.
# Renovate PRs are same-repo, non-fork, and github.actor == 'renovate[bot]' does
# NOT get GitHub's Dependabot-specific token/secret restriction — plain
# pull_request already runs with full secrets here (verified: ai-review.yml
# posted a real review on PR #73). This workflow exists only to give
# dependency-bump PRs a focused prompt instead of the generic code-review one;
# ai-review.yml explicitly skips renovate[bot] so only one comment gets posted.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: renovate-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.AI_ENABLED == 'true' && github.actor == 'renovate[bot]'
    uses: lorenzogirardi/ci-shared/.github/workflows/reusable_pr-diff-review.yml@v1
    with:
      comment_marker: '<!-- ai-dependency-review -->'
      comment_heading: 'AI Dependency Review'
      system_prompt_extra: |
        This PR was opened by Renovate and only touches dependency manifests
        or lockfiles (requirements.txt, Dockerfile base image, GitHub Actions
        pins). There is no application code to review here. Focus on:
        - Size of the version jump (patch/minor/major) and whether it's a major bump.
        - Whether the bump's title/body references a CVE or security advisory.
        - Anything in the diff that looks like more than a version bump (e.g. a
          transitive dependency appearing/disappearing unexpectedly).
        Do not comment on code style or request tests; there is no code here.
      openrouter_model: ${{ vars.OPENROUTER_MODEL }}
      openrouter_endpoint: ${{ vars.OPENROUTER_ENDPOINT }}
      openrouter_site_url: ${{ vars.OPENROUTER_SITE_URL }}
      openrouter_app_name: ${{ vars.OPENROUTER_APP_NAME }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # renovate[bot] PRs are reviewed by the scheduled sweep (ai-review-sweep.yml);
    # agent/* PRs are reviewed, fixed and certified inside the agent pipeline
    # (agent-pipeline.yml), so a second reviewer here would only conflict.
    if: >-
      vars.AI_ENABLED == 'true' && github.actor != 'renovate[bot]' &&
      !startsWith(github.head_ref, 'agent/')
    uses: lorenzogirardi/ci-shared/.github/workflows/reusable_pr-diff-review.yml@v2
    with:
      openrouter_model: ${{ vars.OPENROUTER_MODEL }}
      openrouter_endpoint: ${{ vars.OPENROUTER_ENDPOINT }}
      openrouter_site_url: ${{ vars.OPENROUTER_SITE_URL }}
      openrouter_app_name: ${{ vars.OPENROUTER_APP_NAME }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}

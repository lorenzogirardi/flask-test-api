# Throwaway stack for the k8s-check CI job (kind): the app image under test with
# REAL PostgreSQL and Redis, so the integration suite exercises the real
# backends instead of the in-memory fallback. Credentials are CI-only and the
# cluster is destroyed with the runner. IMAGE_PLACEHOLDER is replaced by the job.
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      # A Service named "redis" would otherwise inject REDIS_PORT=tcp://<ip>:6379
      # (docker-link style), which the app's integer REDIS_PORT setting rejects.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - {name: POSTGRES_USER, value: pytbak}
            - {name: POSTGRES_PASSWORD, value: pytbak}
            - {name: POSTGRES_DB, value: pytbak}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "pytbak"]}
            periodSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      # A Service named "redis" would otherwise inject REDIS_PORT=tcp://<ip>:6379
      # (docker-link style), which the app's integer REDIS_PORT setting rejects.
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata: {name: pytbak}
spec:
  selector: {app: pytbak}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pytbak}
spec:
  replicas: 1
  selector: {matchLabels: {app: pytbak}}
  template:
    metadata: {labels: {app: pytbak}}
    spec:
      # A Service named "redis" would otherwise inject REDIS_PORT=tcp://<ip>:6379
      # (docker-link style), which the app's integer REDIS_PORT setting rejects.
      enableServiceLinks: false
      containers:
        - name: pytbak
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8000}]
          env:
            - {name: APP_ENV, value: development}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://pytbak:pytbak@postgres:5432/pytbak"}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: PROMETHEUS_ENABLED, value: "true"}
            - {name: DEBUG_ENDPOINTS_ENABLED, value: "true"}
            - {name: MCP_ENABLED, value: "true"}
            - {name: ERROR_INJECTION_ENABLED, value: "true"}
            - {name: DIAG_USERNAME, value: admin}
            - {name: DIAG_PASSWORD, value: password}
          readinessProbe:
            httpGet: {path: /api/mgmt/ready, port: 8000}
            periodSeconds: 3
            failureThreshold: 30

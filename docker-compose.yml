version: '3.8'
services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - DIAG_USERNAME=admin
      - DIAG_PASSWORD=password
    depends_on:
      - redis
